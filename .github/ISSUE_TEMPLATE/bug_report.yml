name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v1.2.3
  - type: textarea
    id: context
    attributes:
      label: Environment, logs, screenshots
