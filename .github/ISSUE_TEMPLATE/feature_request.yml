name: Feature request
description: Propose a new capability or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today, and for whom.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like. Alternatives considered.
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How we will know it works.
