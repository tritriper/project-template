# PRs into dev are squash-merged, so the PR title becomes the commit: it must be a Conventional Commit.
name: PR title

on:
  pull_request_target: # no code is checked out: safe for PRs from forks
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            build
            ci
            chore
          requireScope: false
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: 'Start the summary with a lower-case letter and do not end it with a period.'
