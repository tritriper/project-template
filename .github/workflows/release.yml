# On a vX.Y.Z tag: check it, build and push the image to GHCR, create the GitHub Release.
# The infra repository is updated by hand for now (docs/adr/0005-deployment.md).
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - id: version
        name: Check tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Tag $GITHUB_REF_NAME is not on main"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## [$version]' section"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on && /^\[[^]]+\]: / {exit}
            on && /^<!--/ {exit}
            on {print}' CHANGELOG.md > notes.md
          cat notes.md

      - id: docker
        name: Dockerfile present?
        run: |
          if [ -f Dockerfile ]; then echo "build=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::No Dockerfile: image not built"; fi

      - if: steps.docker.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - if: steps.docker.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.docker.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=semver,pattern={{version}}

      - if: steps.docker.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Updates the notes when the release was already published from the GitHub UI.
      - name: GitHub Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi

      - name: Next step
        run: |
          {
            echo "### ${GITHUB_REF_NAME} released"
            echo "Update the image tag in the infra repository by hand: \`ghcr.io/${GITHUB_REPOSITORY,,}:${{ steps.version.outputs.version }}\`"
            echo "Then back-merge \`main\` into \`dev\` (merge commit)."
          } >> "$GITHUB_STEP_SUMMARY"
