# Weekly update PRs for CI actions and the docs site. Add the project's own ecosystems here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: weekly }
    commit-message: { prefix: ci }
  - package-ecosystem: npm
    directory: /docs/site
    target-branch: dev
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
    groups:
      docs-site: { patterns: ['*'] }
